description = "Quick reference for couponcoder levels, skills, and commands"
prompt = "Show the couponcoder quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /couponcoder lite (build what's asked, name the lazier alternative in one line), /couponcoder (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /couponcoder ultra (deletion before addition, challenges the requirement before building). Commands: /couponcoder-review (over-engineering review of the current changes), /couponcoder-audit (whole-repo over-engineering audit), /couponcoder-debt (harvest couponcoder: comments into a tracked ledger), /couponcoder-gain (measured-impact scoreboard from the benchmark), /couponcoder-help (this card). Deactivate with 'stop couponcoder', 'normal mode', or /couponcoder off; resume anytime with /couponcoder. Default mode is full; change it with the COUPONCODER_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/couponcoder/config.json (Windows: %APPDATA%\\couponcoder\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
