name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege: tests only need to read the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, so `@v4`
      # lets the action's owner run new code in CI without a diff here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # couponcoder: version pin only — one dep, so a pin is enough to stop silent
      # drift. Move to a requirements.txt with --require-hashes if an auditor wants
      # artifact-level integrity, or if a second Python dep ever shows up.
      - name: Install Python deps for correctness checks
        run: pip install pandas==3.0.3

      # npm ci installs exactly the lockfile and fails if package.json disagrees;
      # npm install would silently re-resolve the ^ ranges on every run.
      - name: Install MCP deps
        run: npm ci --prefix couponcoder-mcp

      - name: Check rule copies
        run: node scripts/check-rule-copies.js

      - name: Check version consistency
        run: node scripts/check-versions.js

      - name: Run tests
        run: npm test
